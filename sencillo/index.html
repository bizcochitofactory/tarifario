var rows=[].map.call(tb.querySelectorAll('tbody tr'),function(r){return [].slice.call(r.children)});
var labels=rows.map(function(r){return ptxt(r[0])});
var typeB=labels.every(function(l){return /^(Unidad|Dsd \d+[up]\.)$/.test(l)});
var vc=[],lc=[];heads.forEach(function(h,i){if(i>0){if(/^Lam/.test(h)||/^Adicional/.test(h))lc.push(i);else if(h!=='Muestra')vc.push(i)}});
var vn=vc.map(function(i){return heads[i]});
function lamRow(r){var o=[];lc.forEach(function(c){var l=lamOf(r[c]);if(l)o.push({label:heads[c],price:l.price,kind:l.kind})});return o}
if(typeB){var rp=vc.map(function(c){var ts=[];for(var k=0;k<rows.length;k++){var v=cellTiers(rows[k][c]);if(!v)return null;ts.push([minOf(labels[k]),v[0][1]])}return ts});
return{sizes:[''],variants:vn,prices:[rp],lam:[lamRow(rows[0])],sizeHead:heads[0]}}
return{sizes:labels,variants:vn,prices:rows.map(function(r){return vc.map(function(c){return cellTiers(r[c])})}),lam:rows.map(lamRow),sizeHead:heads[0]}}
function parseDoc(doc,catName){var out=[];
[].forEach.call(doc.querySelectorAll('main .price-card'),function(card){
var cid=card.id,title=ptxt(card.querySelector('h3')),sb=card.querySelector('.subtitle'),desc=sb?ptxt(sb):'';
var tables=[].slice.call(card.querySelectorAll('table.price-table')),extras=[].map.call(card.querySelectorAll('.extras-title'),ptxt);
if(cid==='acrilicos'){var bars=[],re=/<p>Sección (\d)<\/p><p>\$(\d+)<\/p>/g,m,h=card.innerHTML;while((m=re.exec(h)))bars.push(parseInt(m[2],10));
var hd=[].map.call(tables[0].querySelectorAll('th'),ptxt).slice(1);
var ad=[].map.call(card.querySelectorAll('.adicionales-item'),function(e){var ps=e.querySelectorAll('p'),pr=/\$(\d+)/.exec(ptxt(e.querySelector('p.price')));return{n:ptxt(ps[0]),p:parseInt(pr[1],10)}});
out.push({id:cid,cat:catName,name:title,desc:'Se vende por sección. Si salen más productos, no hay cobro adicional.',unit:'sección',sizes:hd,variants:['Precio'],prices:bars.map(function(p){return [[[1,p]]]}),lam:bars.map(function(){return []}),bifaz:false,sizeHead:'Sección',addons:ad});return}
tables.forEach(function(tb,ti){var p=parseTable(tb);var name=ti===0?title:title+' — '+(extras.length>=ti?extras[ti-1]:'otro');
if(ti>0&&extras.length>=ti&&!extras[ti-1])name=title+' — más opciones';
p.id=cid+(ti===0?'':'-'+(ti+1));p.cat=catName;p.name=name;p.desc=ti===0?desc:'';p.unit='unidad';p.bifaz=/bifaz/i.test(title);out.push(p)})});
return out}
function buildGroups(d){var by={};d.forEach(function(p){by[p.id]=p});var used={},groups=[],seen={};
GCFG.forEach(function(g){g[3].forEach(function(i){used[i]=g})});
d.forEach(function(p){var g=used[p.id];if(g){if(seen[g[0]])return;seen[g[0]]=1;groups.push({id:g[0],name:g[1],cat:g[2],items:g[3],labels:g[4]})}else groups.push({id:p.id,name:p.name,cat:p.cat,items:[p.id],labels:[]})});
return groups}
function liveLoad(){return Promise.all(PAGES.map(function(pg){return fetch('../'+pg[0]+'/',{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){return parseDoc(new DOMParser().parseFromString(t,'text/html'),pg[1])})})).then(function(all){
var d=[].concat.apply([],all);if(d.length<25)return null;
var groups=buildGroups(d);var ok=groups.every(function(g){return g.items.every(function(i){return d.some(function(p){return p.id===i})})});
return ok?{products:d,groups:groups}:null}).catch(function(){return null})}
function boot(d,src){DATA=d.products;GROUPS=d.groups;prepare();window.__CAT_SOURCE=src;render()}
boot(SNAP,'snapshot');
liveLoad().then(function(d){if(d&&JSON.stringify(d)!==JSON.stringify(SNAP)){boot(d,'live')}else if(d)window.__CAT_SOURCE='live'});

</script>
